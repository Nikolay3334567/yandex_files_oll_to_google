# Сборка YandexToGoogle.exe на настоящей Windows: сначала все проверки, потом exe,
# потом проверка, что сам exe запускается. Готовый файл — в Releases (тег «latest»)
# и во вкладке Actions (артефакт YandexToGoogle-windows).
name: Windows exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install --disable-pip-version-check requests==2.32.3 pyinstaller==6.11.1

      - name: Модульные проверки
        run: python tests/test_unit.py

      - name: Сквозные проверки на имитации Яндекса и Google
        run: python tests/test_e2e.py

      - name: Сборка exe
        run: >-
          pyinstaller --noconfirm --onefile --console --name YandexToGoogle
          --add-data "ya2gd/static;ya2gd/static" --collect-submodules ya2gd --hidden-import tkinter
          launcher.py

      - name: Проверка, что exe запускается
        shell: pwsh
        run: |
          $env:YA2GD_DATA = "$env:RUNNER_TEMP\exe-data"
          $p = Start-Process dist\YandexToGoogle.exe -ArgumentList "--no-browser","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/status; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "exe не ответил" }
          Write-Host "exe работает, версия $($r.version), данные: $($r.data_dir)"

      - uses: actions/upload-artifact@v4
        with:
          name: YandexToGoogle-windows
          path: dist/YandexToGoogle.exe

      - name: Публикация в Releases (тег latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/YandexToGoogle.exe --target "$GITHUB_SHA" --prerelease \
            --title "YandexToGoogle.exe — последняя сборка" \
            --notes "Собрано из ветки ${GITHUB_REF_NAME} (${GITHUB_SHA::7}); все проверки пройдены на Windows. Скачайте YandexToGoogle.exe ниже и запустите. Инструкция — в README репозитория."
